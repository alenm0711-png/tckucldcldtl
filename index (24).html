<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Орбита — магазин планет</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600&family=Unbounded:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./style.css">
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"}}</script>
<script>document.documentElement.classList.add('js')</script>
</head>
<body>
<canvas class="webgl" aria-hidden="true"></canvas>

<header class="top">
  <a class="logo" href="#top">Орбита</a>
  <button class="cart-btn" id="cartBtn">Корзина <b id="cartCount">0</b></button>
</header>

<main>
  <section class="hero">
    <h1>
      <span class="w"><span style="--i:0">Купите</span></span>
      <span class="w"><span style="--i:1">свою</span></span>
      <span class="w"><span style="--i:2">планету</span></span>
    </h1>
    <p>Шесть миров с документами, координатами и доставкой на орбиту. Проведите курсором по галактике — звёзды отзовутся.</p>
    <a class="btn" href="#catalog">Выбрать планету</a>
  </section>

  <section id="catalog" class="catalog">
    <h2>Каталог</h2>
    <div class="filters" id="filters">
      <button aria-pressed="true" data-f="all">Все</button>
      <button aria-pressed="false" data-f="rocky">Скалистые</button>
      <button aria-pressed="false" data-f="gas">Газовые гиганты</button>
      <button aria-pressed="false" data-f="ice">Ледяные</button>
    </div>
    <div class="grid" id="grid"></div>
  </section>
</main>

<footer>Учебный проект: планеты вымышлены, оплата не производится.</footer>

<aside class="cart" id="cart" inert>
  <div class="cart-head"><h3>Корзина</h3><button id="cartClose" aria-label="Закрыть">✕</button></div>
  <ul id="cartList"></ul>
  <p class="total">Итого: <b id="cartTotal">0 $</b></p>
  <button class="btn" id="checkout">Оформить заявку</button>
</aside>
<div class="toast" id="toast" role="status"></div>

<script type="module" src="./galaxy.js"></script>
<script src="./script.js" defer></script>
</body>
</html>
